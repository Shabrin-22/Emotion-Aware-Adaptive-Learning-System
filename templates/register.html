{% extends "base.html" %}
{% block title %}Register - Emotion-Aware Adaptive Learning{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span style="font-size: 2.5rem;">✨</span>
      <h1>Create Account</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join the adaptive learning platform and optimize your productivity.</p>
    </div>

    <form method="post" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register Account</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent); font-weight: 600;">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
